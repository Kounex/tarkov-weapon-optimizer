services:
  frontend:
    image: ghcr.io/kounex/tarkov-optimizer-frontend:latest
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      vision-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3

  vision-proxy:
    image: ghcr.io/kounex/tarkov-vision-proxy:latest
    restart: unless-stopped
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 3s
      retries: 3
